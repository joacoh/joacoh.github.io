# =============================================================================
# Interactive Talk & Event Map Data
# =============================================================================
# Each entry represents a marker on the interactive map at /talks/.
#
# Supported categories (determines marker color):
#   - Academic Talk      (cyan)
#   - Workshop Lead      (amber)   -- alias: Workshop
#   - Conference Poster  (violet)  -- alias: Poster
#   - Outreach Talk      (green)   -- alias: Outreach
#   - Event              (coral)
#
# Option 1: Link an existing talk from _talks/ using `permalink`
#   Automatically pulls title, date, location, venue, type, and link.
#   You can optionally override `location`, `venue`, `title`, `date`, or `category`.
#
#   - permalink: /talks/2026-07-07-talk
#     lat: -35.2809
#     lng: 149.1300
#
# Option 2: Add an event (internship, visiting stay, summer school, etc.)
#   Include `title`, `category: "Event"`, `location`, `lat`, `lng`, and `length`.
#   Optional fields: `date`, `venue`, `url`, `description`.
#
#   - title: "Research Internship"
#     category: "Event"
#     venue: "Center for Astrophysics | Harvard & Smithsonian"
#     location: "Cambridge, MA, USA"
#     date: "2024"
#     length: "3 months"
#     lat: 42.3814
#     lng: -71.1281
# =============================================================================

